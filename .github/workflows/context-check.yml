# 模板：拷贝到每个业务 repo 的 .github/workflows/context-check.yml
#
# 这是 Notion MVP 第 1 周的"PR 自动检测"骨架。它做轻量、可独立运行的检查：
#   1) PR 是否用 GitHub 原生 closing keyword 关联 issue
#   2) PR 是否动到高风险文件（API / schema / 权限 / agent 协议）
#   3) PR 标题主体是否中文，描述是否声明了 intent 与 risk
# 更复杂的"跨 repo 影响面 / 同文件冲突 / 缺 decision"由 Context Bot（中心服务）完成，
# 见 team-os/README.md 的 Context Bot 章节。

name: context-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  context-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require GitHub-native linked issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -Eiq '(^|[^[:alnum:]_])(closes|fixes|resolves)[[:space:]]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+|#[0-9]+|https://github.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+)' \
            && echo "✅ GitHub-native linked issue found" \
            || { echo "::error::PR 必须用 Fixes #N / Closes #N / Resolves #N 关联 issue，这样 Project 的 Linked pull requests 才会自动归到 issue 行。"; exit 1; }

      - name: Require Chinese PR title body
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.TITLE || '';
          const body = title
            .replace(/^\s*(\[[^\]]+\]\s*)+/g, '')
            .replace(/^\s*(?:feat|fix|docs|chore|refactor|test|style|perf|ci|build|revert)(?:\([^)]+\))?:\s*/i, '')
            .trim();
          if (!/\p{Script=Han}/u.test(body)) {
            console.log('::error::PR 标题可以保留 [codex] / feat: / fix: 等标志，但标题主体必须用中文说明交付内容。');
            process.exit(1);
          }
          console.log('✅ Chinese PR title body found');
          NODE

      - name: Require intent & risk sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -qi 'Intent'  || { echo "::error::PR 描述缺少 Intent。"; exit 1; }
          echo "$BODY" | grep -qi 'Risk'    || { echo "::error::PR 描述缺少 Risk。"; exit 1; }
          echo "✅ intent & risk present"

      - name: Flag high-risk file changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"; echo "$changed"
          # 高风险路径：动到契约/schema/权限/agent 协议时提示需 decision（warning，不阻断）
          if echo "$changed" | grep -Eq '(^|/)(api|proto)/|schema\.prisma|/migrations/|/ent/|auth|billing|agent'; then
            echo "::warning::改动涉及高风险路径（api/proto/schema/权限/agent）。请确认已写 decision 并通知下游 owner（见 team-os/maps/dependency-map.yml）。"
          fi
